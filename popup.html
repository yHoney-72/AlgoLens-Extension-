<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlgoLens</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <!-- HEADER -->
    <header class="al-header">
        <div class="al-logo">
            <span class="al-logo-icon">◆</span>
            <span class="al-logo-text">AlgoLens</span>
        </div>
    </header>

    <!-- MAIN -->
    <main class="al-main">

        <!-- LOADING -->
        <div id="state-loading" class="al-state">
            <div class="al-spinner"></div>
            <p class="al-state-text">Analyzing problem...</p>
        </div>

        <!-- NO PROBLEM -->
        <div id="state-no-problem" class="al-state hidden">
            <div class="al-empty-icon">◇</div>
            <h3 class="al-state-title">No Problem Detected</h3>
            <p class="al-state-text">Open a LeetCode problem page and try again.</p>
        </div>

        <!-- ERROR -->
        <div id="state-error" class="al-state hidden">
            <div class="al-empty-icon">!</div>
            <h3 class="al-state-title">Something went wrong</h3>
            <p id="error-message" class="al-state-text"></p>
            <button id="retry-btn" class="al-btn">Retry</button>
        </div>

        <!-- RESULTS -->
        <div id="state-results" class="al-state hidden">
            <div class="al-problem-info">
                <h2 id="problem-title" class="al-problem-title">Problem</h2>
                <div class="al-problem-meta">
                    <span id="problem-difficulty" class="al-badge">Easy</span>
                    <span id="cache-badge" class="al-badge al-badge-cache hidden">⚡ Cached</span>
                </div>
            </div>

            <div class="al-table-wrapper">
                <table class="al-table">
                    <thead>
                        <tr>
                            <th class="al-th-rank"></th>
                            <th class="al-th-approach">Approach</th>
                            <th class="al-th-time">Time</th>
                            <th class="al-th-space">Space</th>
                            <th class="al-th-rating">Rating</th>
                        </tr>
                    </thead>
                    <tbody id="approaches-tbody"></tbody>
                </table>
            </div>

            <p class="al-footnote">Click any row for details</p>
        </div>

    </main>

    <!-- MODAL -->
    <div id="modal-overlay" class="al-modal-overlay hidden">
        <div class="al-modal">
            <button id="modal-close" class="al-modal-close">✕</button>
            <h3 id="modal-title" class="al-modal-title"></h3>
            <div id="modal-body" class="al-modal-body"></div>
        </div>
    </div>
        <!-- Resize handle -->
    <div id="resize-handle" class="al-resize-handle">
        <svg width="10" height="10" viewBox="0 0 10 10">
            <path d="M 8 2 L 2 8 M 8 5 L 5 8 M 8 8 L 8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
    </div>

    <script src="popup.js"></script>
    
</body>
</html>
